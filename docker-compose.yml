services:
  frontend:
    image: ghcr.io/${DEV_USER}/frontend-sp:latest  
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/${DEV_USER}/backend-sp:latest   
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Bogota
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONT_URL: ${FRONT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SWAGGER_ENABLED: true
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-${MQTT_TOPICS}}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
