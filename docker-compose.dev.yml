services:
  backend:
    build:
      context: ./Backend-sistem-SP
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/security_alert?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: sp_user
      DB_PASSWORD: sp_password
      JWT_SECRET: x35HJJXmk+9AkMaFEl12AKyXP717W+pf/Fofw502WCs=
      JWT_EXPIRATION: 3600000
      FRONT_URL: http://localhost:5173
      SWAGGER_ENABLED: "true"
    volumes:
      - ./Backend-sistem-SP:/app
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      - mysql

  frontend:
    build:
      context: ./Frontend-sistema-SP
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./Frontend-sistema-SP:/app
      - frontend-node-modules:/app/node_modules

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: security_alert
      MYSQL_USER: sp_user
      MYSQL_PASSWORD: sp_password
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql-data:
  gradle-cache:
  frontend-node-modules:
