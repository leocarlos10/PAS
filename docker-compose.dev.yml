services:

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    env_file: .env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./Backend-sistem-SP
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-${MQTT_TOPICS:-jardin/#}}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    volumes:
      - ./Backend-sistem-SP:/app
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend-sistema-SP
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CRYPTO_SECRET_KEY: ${VITE_CRYPTO_SECRET_KEY}
    volumes:
      - ./Frontend-sistema-SP:/app
      - frontend-node-modules:/app/node_modules



volumes:
  mysql-data:
  frontend-node-modules:
