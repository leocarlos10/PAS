spring:
  application:
    name: security_alert

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa: 
    hibernate:
      ddl-auto: update
    
    database-platform: org.hibernate.dialect.MySQLDialect

  config:
    import: optional:secrets.properties
